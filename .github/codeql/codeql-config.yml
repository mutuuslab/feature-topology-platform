# CodeQL 설정 (security.yml에서 씀) — 제품 코드(FF/backend/src·FF/frontend/src·FF/contracts/src의 시험 아닌 파일)는 빼지 않는다.
# 빼는 것은 검사 결과가 설계상 의도인 것만, 이유를 함께 적는다. 새 항목을 더하려면 PR에서 이유를 검토받는다.
name: FF CodeQL
