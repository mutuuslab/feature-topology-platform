# Cloudflare Pages 공개 조회용 데모 배포 (GitHub Actions 러너에서 빌드→직접 업로드).
# verify 게이트를 통과한 커밋만 배포한다. FF/는 npm workspaces — 설치는 FF 루트에서.
name: Deploy to Cloudflare Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install & build
        working-directory: FF
        # 공개 조회용 데모 — 전시 차량 480대와 풍부한 시나리오를 격리 시드에서 만든다. 실행 중 고객 DB는 읽지 않는다.
        run: |
          npm ci
          npm run build:contracts
          npm run build -w feature-topology-backend
          FF_SHOWCASE=1 FF_SHOWCASE_VEHICLES=480 FF_SYNTHETIC=24000 npm run snapshot:api
          VITE_DATA_MODE=static npm run build -w feature-topology-frontend
          node -e "require('node:fs').writeFileSync('frontend/dist/release.json', JSON.stringify({commit:process.env.GITHUB_SHA,builtAt:new Date().toISOString(),mode:'static'}))"
      # wrangler는 정확한 버전으로 고정한다 — 배포 도구가 몰래 바뀌지 않게(출시 준비 RD-SEC-15). 올릴 때 두 곳을 함께 바꾼다.
      - name: Ensure Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.152.0 pages project create feature-topology --production-branch=main || true
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.152.0 pages deploy FF/frontend/dist --project-name=feature-topology --branch=main
