# GitHub Pages 배포 (프론트 FF/frontend). Pages 활성화(공개 repo 또는 Pro) 시 동작.
# 활성화: 저장소 Settings ▸ Pages ▸ Source = GitHub Actions.
name: Deploy Frontend to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FF/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || npm install
      - run: npm run build
        env:
          GITHUB_PAGES: '1'
      - run: cp dist/index.html dist/404.html   # SPA 라우팅 fallback
      - uses: actions/upload-pages-artifact@v3
        with:
          path: FF/frontend/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
