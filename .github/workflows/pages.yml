# GitHub Pages 배포 (프론트 FF/frontend). 기본 배포는 Cloudflare(cloudflare.yml).
# 이 워크플로는 비활성(수동 실행 전용) — Pages 미활성 상태에서 매 push마다 deploy 404로
# 실패하던 문제를 막기 위해 push 자동 트리거 제거.
# GitHub Pages 사용 시: Settings ▸ Pages ▸ Source = GitHub Actions(private repo는 Pro/Team 필요)
#   후 Actions 탭에서 'Run workflow'로 수동 실행.
name: Deploy Frontend to Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FF/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || npm install
      - run: npm run build
        env:
          GITHUB_PAGES: '1'
      - run: cp dist/index.html dist/404.html   # SPA 라우팅 fallback
      - uses: actions/upload-pages-artifact@v3
        with:
          path: FF/frontend/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
