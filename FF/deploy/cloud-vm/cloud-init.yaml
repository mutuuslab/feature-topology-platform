#cloud-config
# 클라우드 VM 첫 부팅 설정 — Ubuntu 24.04 LTS(x86_64·arm64), 업체 중립(Azure custom data · AWS user data · Hetzner/DigitalOcean user data).
# 하는 일: 보안 업데이트 자동 적용 · Docker Engine + compose(공식 저장소) · 방화벽(ufw: SSH·80·443만) · 스왑 2 GiB ·
#          SSH 비밀번호 로그인 끔 · fail2ban · 배포 키트 폴더(/opt/ff). 키트 내려받기·비밀 생성·기동은 사람이 한다(20-99 §설치).
# 비밀을 여기에 넣지 않는다 — user data는 업체 콘솔·메타데이터에서 다시 읽힐 수 있다.
# SSH 비밀번호 로그인 끔 — cloud-init 자신의 50-cloud-init.conf에도 no로 쓰게 한다
ssh_pwauth: false
package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - curl
  - gnupg
  - git
  - jq
  - ufw
  - fail2ban
  - unattended-upgrades
  # fail2ban이 systemd 저널을 읽는다(최소 이미지에는 /var/log/auth.log가 없을 수 있다)
  - python3-systemd
  - rclone
  - openssl

write_files:
  # 보안 업데이트 자동 적용 + 필요하면 새벽 재부팅(컨테이너는 restart: unless-stopped로 다시 뜬다)
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
  - path: /etc/apt/apt.conf.d/52ff-unattended
    content: |
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "04:30";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
  # 컨테이너 로그 크기 제한 · 데몬 재시작에도 컨테이너 유지
  - path: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "50m", "max-file": "5" },
        "live-restore": true
      }
  # sshd는 같은 키의 첫 값을 쓴다 — sshd_config.d는 이름 순이므로 50-cloud-init.conf(업체 이미지에 따라 PasswordAuthentication yes)보다 앞 이름
  - path: /etc/ssh/sshd_config.d/00-ff-hardening.conf
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      # root는 키로만 — Hetzner·DigitalOcean 기본 사용자가 root라 아예 막으면 잠긴다(관리 계정을 따로 두면 no로)
      PermitRootLogin prohibit-password
      PermitEmptyPasswords no
      MaxAuthTries 3
      LoginGraceTime 30
      X11Forwarding no
      AllowAgentForwarding no
  - path: /etc/fail2ban/jail.d/sshd.local
    content: |
      [sshd]
      enabled = true
      backend = systemd
      maxretry = 5
      findtime = 10m
      bantime = 1h
  - path: /etc/sysctl.d/60-ff.conf
    content: |
      vm.swappiness = 10

runcmd:
  # 스왑 2 GiB(없을 때만) — 첫 기동의 시연 데이터 생성이 메모리를 많이 쓴다
  - [sh, -c, 'if ! swapon --show | grep -q .; then fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile && echo "/swapfile none swap sw 0 0" >> /etc/fstab; fi']
  - [sysctl, --system]
  # Docker 공식 저장소(https://docs.docker.com/engine/install/ubuntu/)
  - [sh, -c, 'install -m 0755 -d /etc/apt/keyrings && curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc && chmod a+r /etc/apt/keyrings/docker.asc']
  - [sh, -c, 'echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" > /etc/apt/sources.list.d/docker.list']
  - [sh, -c, 'apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin']
  - [systemctl, enable, --now, docker]
  # docker 그룹은 root와 같은 권한이라 일반 사용자를 넣지 않는다 — 스크립트는 sudo로 실행한다(20-99 §4)
  # 방화벽 — SSH·HTTP(인증서 발급·https로 넘김)·HTTPS(+HTTP/3). 다른 포트는 닫는다.
  # 주의: Docker가 연 포트는 ufw를 거치지 않는다 — compose는 Caddy의 80·443만 연다(DB·Unleash는 호스트 포트 없음)
  - [ufw, default, deny, incoming]
  - [ufw, default, allow, outgoing]
  # SSH는 연결 속도 제한(30초 6회) — 업체 방화벽에서 관리자 IP로 좁히는 것이 먼저다
  - [ufw, limit, OpenSSH]
  - [ufw, allow, 80/tcp]
  - [ufw, allow, 443/tcp]
  - [ufw, allow, 443/udp]
  - [ufw, --force, enable]
  - [systemctl, enable, --now, unattended-upgrades]
  - [systemctl, enable, --now, fail2ban]
  # Ubuntu 24.04는 소켓 활성화(ssh.socket) — 서비스가 꺼져 있어도 실패하지 않게
  - [systemctl, try-reload-or-restart, ssh]
  # 배포 키트 자리 — 키트는 사람이 내려받는다(20-99 §설치 3단계)
  - [install, -d, -m, '0755', /opt/ff]
  - [install, -d, -m, '0700', /var/backups/ff-cloud]

final_message: 'FF cloud VM ready after $UPTIME s — next: fetch the kit into /opt/ff and run deploy/cloud-vm/scripts/gen-secrets.sh (docs 20-99)'
