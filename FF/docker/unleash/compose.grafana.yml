# 선택 덧붙임(platform 프로필) — Grafana Cloud로 지표·로그·추적 보내기(80-80).
#   docker compose -f docker-compose.yml -f compose.grafana.yml --profile platform up -d
# .env에 deploy/grafana/grafana.env.example 항목을 채운다. 로컬 PC에 상시 띄우지 않는다(설치 서버용).
services:
  platform:
    environment:
      FF_METRICS_TOKEN: '${FF_METRICS_TOKEN:?FF_METRICS_TOKEN — openssl rand -hex 24}'
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      OTEL_SERVICE_NAME: ff-platform
      FF_GRAFANA_WEBHOOK_SECRET: ${FF_GRAFANA_WEBHOOK_SECRET:-}
      FF_GRAFANA_WEBHOOK_TOKEN: ${FF_GRAFANA_WEBHOOK_TOKEN:-}

  alloy:
    profiles: ['platform']
    image: grafana/alloy:v1.21.0
    restart: unless-stopped
    command: ['run', '--server.http.listen-addr=127.0.0.1:12345', '--storage.path=/var/lib/alloy/data', '--disable-reporting', '/etc/alloy/config.alloy']
    environment:
      GRAFANA_OTLP_URL: '${GRAFANA_OTLP_URL:?GRAFANA_OTLP_URL}'
      GRAFANA_OTLP_INSTANCE_ID: '${GRAFANA_OTLP_INSTANCE_ID:?GRAFANA_OTLP_INSTANCE_ID}'
      GRAFANA_OTLP_TOKEN: '${GRAFANA_OTLP_TOKEN:?GRAFANA_OTLP_TOKEN}'
      FF_METRICS_TOKEN: '${FF_METRICS_TOKEN:?FF_METRICS_TOKEN}'
      FF_METRICS_TARGET: platform:9101
      FF_INSTANCE_ID: ${FF_INSTANCE_ID:-ff-docker}
    volumes:
      - ../../deploy/grafana/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      platform: { condition: service_started }
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']

volumes:
  alloy-data:
