<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>화면 복구 · Feature Platform</title>
    <style>body{max-width:42rem;margin:3rem auto;padding:0 1rem;font:16px/1.7 system-ui;color:#17202a;background:#fff}button,a{display:inline-block;padding:.7rem 1rem}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #075ba6}#recovery-result{min-height:2rem}</style>
  </head>
  <body>
    <main>
      <h1>화면 복구</h1>
      <p>이 사이트의 탭을 모두 닫고 다시 열어 보세요. 그래도 화면이 비어 있으면 아래 버튼으로 이 브라우저에 저장된 화면 설정을 초기화한 뒤 플랫폼을 다시 엽니다. 브라우저를 바꾸면 다시 로그인해야 할 수 있습니다.</p>
      <h2>브라우저 UI 설정 초기화</h2>
      <p id="reset-description">아래 버튼은 현재 주소의 역할·부서 보기·테마·언어, 차량 모형 설정, 따라하기 진행만 초기화합니다. 로그인 세션·서버 업무 데이터는 지우지 않습니다.</p>
      <button id="reset-ui" type="button" aria-describedby="reset-description">UI 설정 3개 초기화</button>
      <p id="recovery-result" role="status" aria-live="polite"></p>
      <a href="./">플랫폼 다시 열기</a>
      <noscript><p>JavaScript가 꺼져 있어 설정 초기화를 실행할 수 없습니다. Chrome의 이 사이트 JavaScript 허용 설정을 확인해 주세요.</p></noscript>
    </main>
    <script src="./recovery.js" defer></script>
  </body>
</html>
