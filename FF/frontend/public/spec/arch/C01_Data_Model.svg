<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="590" viewBox="0 0 1050 590"><title>class  정의 버전과 이력 및 사용처</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="9" refY="5" orient="auto" viewBox="0 0 10 10"><path d="M0 0 L10 5 L0 10Z" fill="#34566d"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="20" y="28.0" font-family="Noto Sans CJK KR" font-size="22" font-weight="700" fill="#183a50">class  정의 버전과 이력 및 사용처</text><rect x="20" y="70" width="305" height="150" fill="#f0f5f9" stroke="#728fA3"/><path d="M20 118 H325" stroke="#9fb3c1"/><text x="34" y="100.0" font-family="Noto Sans CJK KR" font-size="19" font-weight="700" fill="#183a50">FeatureMaster</text><text x="34" y="146.0" font-family="Noto Sans CJK KR" font-size="17" font-weight="400" fill="#183a50">scopeRef + featureId</text><text x="34" y="171.5" font-family="Noto Sans CJK KR" font-size="17" font-weight="400" fill="#183a50">identityDecisionRef</text><text x="34" y="197.0" font-family="Noto Sans CJK KR" font-size="17" font-weight="400" fill="#183a50">지속 식별자</text><rect x="410" y="70" width="295" height="150" fill="#f0f5f9" stroke="#728fA3"/><path d="M410 118 H705" stroke="#9fb3c1"/><text x="424" y="100.0" font-family="Noto Sans CJK KR" font-size="19" font-weight="700" fill="#183a50">FeatureVersion</text><text x="424" y="146.0" font-family="Noto Sans CJK KR" font-size="17" font-weight="400" fill="#183a50">definitionVersion + revision</text><text x="424" y="171.5" font-family="Noto Sans CJK KR" font-size="17" font-weight="400" fill="#183a50">정의 body와 정확 참조</text><text x="424" y="197.0" font-family="Noto Sans CJK KR" font-size="17" font-weight="400" fill="#183a50">lifecycleState</text><rect x="775" y="70" width="255" height="150" fill="#f0f5f9" stroke="#728fA3"/><path d="M775 118 H1030" stroke="#9fb3c1"/><text x="789" y="100.0" font-family="Noto Sans CJK KR" font-size="19" font-weight="700" fill="#183a50">DefinitionSnapshot</text><text x="789" y="146.0" font-family="Noto Sans CJK KR" font-size="17" font-weight="400" fill="#183a50">snapshotId + contentHash</text><text x="789" y="171.5" font-family="Noto Sans CJK KR" font-size="17" font-weight="400" fill="#183a50">schemaVersion</text><text x="789" y="197.0" font-family="Noto Sans CJK KR" font-size="17" font-weight="400" fill="#183a50">승인 대상 불변 내용</text><rect x="20" y="350" width="305" height="155" fill="#f0f5f9" stroke="#728fA3"/><path d="M20 398 H325" stroke="#9fb3c1"/><text x="34" y="380.0" font-family="Noto Sans CJK KR" font-size="19" font-weight="700" fill="#183a50">BOM와 Catalog와 Topology</text><text x="34" y="426.0" font-family="Noto Sans CJK KR" font-size="17" font-weight="400" fill="#183a50">정확 FeatureVersion 참조</text><text x="34" y="451.5" font-family="Noto Sans CJK KR" font-size="17" font-weight="400" fill="#183a50">각 Core가 정본 작성</text><text x="34" y="477.0" font-family="Noto Sans CJK KR" font-size="17" font-weight="400" fill="#183a50">C01에서는 사용처 역조회</text><rect x="410" y="350" width="295" height="155" fill="#f0f5f9" stroke="#728fA3"/><path d="M410 398 H705" stroke="#9fb3c1"/><text x="424" y="380.0" font-family="Noto Sans CJK KR" font-size="19" font-weight="700" fill="#183a50">Revision과 Audit</text><text x="424" y="426.0" font-family="Noto Sans CJK KR" font-size="17" font-weight="400" fill="#183a50">before / after Snapshot</text><text x="424" y="451.5" font-family="Noto Sans CJK KR" font-size="17" font-weight="400" fill="#183a50">actor reason command</text><text x="424" y="477.0" font-family="Noto Sans CJK KR" font-size="17" font-weight="400" fill="#183a50">변경 경로와 시각</text><rect x="775" y="350" width="255" height="155" fill="#f0f5f9" stroke="#728fA3"/><path d="M775 398 H1030" stroke="#9fb3c1"/><text x="789" y="380.0" font-family="Noto Sans CJK KR" font-size="19" font-weight="700" fill="#183a50">Review와 Approval</text><text x="789" y="426.0" font-family="Noto Sans CJK KR" font-size="17" font-weight="400" fill="#183a50">Task 및 배정 주체</text><text x="789" y="451.5" font-family="Noto Sans CJK KR" font-size="17" font-weight="400" fill="#183a50">subjectHash + Profile</text><text x="789" y="477.0" font-family="Noto Sans CJK KR" font-size="17" font-weight="400" fill="#183a50">정의 승인 결과</text><polyline points="325,139 410,139" fill="none" stroke="#34566d" stroke-width="2" marker-end="url(#a)"/><text x="333" y="120.0" font-family="Noto Sans CJK KR" font-size="15" font-weight="400" fill="#183a50">1 → 0..*</text><polyline points="705,139 775,139" fill="none" stroke="#34566d" stroke-width="2" marker-end="url(#a)"/><text x="705" y="121.0" font-family="Noto Sans CJK KR" font-size="15" font-weight="400" fill="#183a50">0..1 승인</text><polyline points="545,220 545,350" fill="none" stroke="#34566d" stroke-width="2" marker-end="url(#a)"/><text x="558" y="286.0" font-family="Noto Sans CJK KR" font-size="15" font-weight="400" fill="#183a50">이력 0..*</text><polyline points="200,350 200,285 460,285 460,220" fill="none" stroke="#34566d" stroke-width="2" marker-end="url(#a)"/><text x="210" y="272.0" font-family="Noto Sans CJK KR" font-size="15" font-weight="400" fill="#183a50">정확 버전 사용 0..*</text><polyline points="700,200 750,200 750,310 900,310 900,350" fill="none" stroke="#34566d" stroke-width="2" marker-end="url(#a)"/><text x="790" y="299.0" font-family="Noto Sans CJK KR" font-size="15" font-weight="400" fill="#183a50">검토 0..*</text><text x="20" y="554.0" font-family="Noto Sans CJK KR" font-size="17" font-weight="400" fill="#183a50">실선은 논리 참조 방향이다. 물리 테이블 분리와 인덱스는 C01-R07의 목표 설계를 적용한다.</text></svg>