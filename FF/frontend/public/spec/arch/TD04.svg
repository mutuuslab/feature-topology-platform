"/><text x="407" y="208.0" text-anchor="start" font-family="Noto Sans CJK KR" font-size="14" font-weight="400" fill="#203c50">정확 BOM과 Topology 조회</text><polyline points="655,275 395,275" fill="none" stroke="#486477" stroke-width="1.8" marker-end="url(#a)" stroke-dasharray="7 5"/><text x="407" y="263.0" text-anchor="start" font-family="Noto Sans CJK KR" font-size="14" font-weight="400" fill="#203c50">멤버와 조건 및 관계 평가</text><polyline points="395,345 910,345" fill="none" stroke="#486477" stroke-width="1.8" marker-end="url(#a)"/><text x="407" y="333.0" text-anchor="start" font-family="Noto Sans CJK KR" font-size="14" font-weight="400" fill="#203c50">현재 구성 hash 검증 요청</text><polyline points="910,408 395,408" fill="none" stroke="#486477" stroke-width="1.8" marker-end="url(#a)" stroke-dasharray="7 5"/><text x="407" y="396.0" text-anchor="start" font-family="Noto Sans CJK KR" font-size="14" font-weight="400" fill="#203c50">현재 hash 평가와 승인 결과</text><polyline points="145,485 395,485" fill="none" stroke="#486477" stroke-width="1.8" marker-end="url(#a)"/><text x="157" y="473.0" text-anchor="start" font-family="Noto Sans CJK KR" font-size="14" font-weight="400" fill="#203c50">승인 내용 발행 요청</text><polyline points="395,555 655,555" fill="none" stroke="#486477" stroke-width="1.8" marker-end="url(#a)"/><text x="407" y="543.0" text-anchor="start" font-family="Noto Sans CJK KR" font-size="14" font-weight="400" fill="#203c50">참조 유효성과 hash 재확인</text><polyline points="395,625 145,625" fill="none" stroke="#486477" stroke-width="1.8" marker-end="url(#a)" stroke-dasharray="7 5"/><text x="157" y="613.0" text-anchor="start" font-family="Noto Sans CJK KR" font-size="14" font-weight="400" fill="#203c50">발행 기록  차량 상태는 미관측</text><text x="25" y="710.0" text-anchor="start" font-family="Noto Sans CJK KR" font-size="16" font-weight="400" fill="#203c50">차단 또는 보류 시 입력과 사유를 보존하며 보완 후 같은 단계의 검증을 다시 수행한다</text></svg>