<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="640" viewBox="0 0 1050 640" role="img"><title>act 조건별 구현 선택과 불확실성 처리</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#486477"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="24" y="30.0" text-anchor="start" font-family="Noto Sans CJK KR" font-size="20" font-weight="700" fill="#203c50">act 조건별 구현 선택과 불확실성 처리</text><rect x="25" y="65" width="440" height="145" fill="#eef4f8" stroke="#8299aa" stroke-width="1.5"/><text x="39" y="89.0" text-anchor="start" font-family="Noto Sans CJK KR" font-size="13" font-weight="400" fill="#496f83">«input»</text><text x="39" y="117.0" text-anchor="start" font-family="Noto Sans CJK KR" font-size="19" font-weight="700" fill="#203c50">승인 Profile와 차량 기준정보</text><path d="M25 130 H465" stroke="#b4c4cf"/><text x="39" y="155.0" text-anchor="start" font-family="Noto Sans CJK KR" font-size="16" font-weight="400" fill="#203c50">국가 의미와 사전 버전 확인</text><text x="39" y="178.2" text-anchor="start" font-family="Noto Sans CJK KR" font-size="16" font-weight="400" fill="#203c50">차종 연식 Trim 옵션 UPG VC</text><rect x="590" y="65" width="435" height="145" fill="#eef4f8" stroke="#8299aa" stroke-width="1.5"/><text x="604" y="89.0" text-anchor="start" font-family="Noto Sans CJK KR" font-size="13" font-weight="400" fill="#496f83">«evaluation»</text><text x="604" y="117.0" text-anchor="start" font-family="Noto Sans CJK KR" font-size="19" font-weight="700" fill="#203c50">조건행 평가</text><path d="M590 130 H1025" stroke="#b4c4cf"/><text x="604" y="155.0" text-anchor="start" font-family="Noto Sans CJK KR" font-size="16" font-weight="400" fill="#203c50">행 안의 조건 AND   행 사이 OR</text><text x="604" y="178.2" text-anchor="start" font-family="Noto Sans CJK KR" font-size="16" font-weight="400" fill="#203c50">결과 TRUE FALSE UNKNOWN</text><polyline points="465,142 590,142" fill="none" stroke="#486477" stroke-width="1.8" marker-end="url(#a)"/><text x="490" y="126.0" text-anchor="start" font-family="Noto Sans CJK KR" font-size="14" font-weight="400" fill="#203c50">평가</text><rect x="25" y="335" width="290" height="170" fill="#fff5e6" stroke="#8299aa" stroke-width="1.5"/><text x="39" y="359.0" text-anchor="start" font-family="Noto Sans CJK KR" font-size="13" font-weight="400" fill="#496f83">«result»</text><text x="39" y="387.0" text-anchor="start" font-family="Noto Sans CJK KR" font-size="19" font-weight="700" fill="#203c50">미정 정보</text><path d="M25 400 H315" stroke="#b4c4cf"/><text x="39" y="425.0" text-anchor="start" font-family="Noto Sans CJK KR" font-size="16" font-weight="400" fill="#203c50">UNKNOWN이 선택을</text><text x="39" y="448.2" text-anchor="start" font-family="Noto Sans CJK KR" font-size="16" font-weight="400" fill="#203c50">바꿀 가능성이 있음</text><text x="39" y="471.4" text-anchor="start" font-family="Noto Sans CJK KR" font-size="16" font-weight="400" fill="#203c50">신규 활성화 보류</text><rect x="380" y="335" width="290" height="170" fill="#fff0ed" stroke="#8299aa" stroke-width="1.5"/><text x="394" y="359.0" text-anchor="start" font-family="Noto Sans CJK KR" font-size="13" font-weight="400" fill="#496f83">«result»</text><text x="394" y="387.0" text-anchor="start" font-family="Noto Sans CJK KR" font-size="19" font-weight="700" fill="#203c50">지원 없음 또는 충돌</text><path d="M380 400 H670" stroke="#b4c4cf"/><text x="394" y="425.0" text-anchor="start" font-family="Noto Sans CJK KR" font-size="16" font-weight="400" fill="#203c50">TRUE 0개  지원 없음</text><text x="394" y="448.2" text-anchor="start" font-family="Noto Sans CJK KR" font-size="16" font-weight="400" fill="#203c50">상이한 구현 복수</text><text x="394" y="471.4" text-anchor="start" font-family="Noto Sans CJK KR" font-size="16" font-weight="400" fill="#203c50">CONFIG_CONFLICT</text><rect x="735" y="335" width="290" height="170" fill="#eaf4ef" stroke="#8299aa" stroke-width="1.5"/><text x="749" y="359.0" text-anchor="start" font-family="Noto Sans CJK KR" font-size="13" font-weight="400" fill="#496f83">«result»</text><text x="749" y="387.0" text-anchor="start" font-family="Noto Sans CJK KR" font-size="19" font-weight="700" fill="#203c50">구현 선택</text><path d="M735 400 H1025" stroke="#b4c4cf"/><text x="749" y="425.0" text-anchor="start" font-family="Noto Sans CJK KR" font-size="16" font-weight="400" fill="#203c50">정확 구현 1개 결정</text><text x="749" y="448.2" text-anchor="start" font-family="Noto Sans CJK KR" font-size="16" font-weight="400" fill="#203c50">선택 사유와 버전 보존</text><text x="749" y="471.4" text-anchor="start" font-family="Noto Sans CJK KR" font-size="16" font-weight="400" fill="#203c50">후속 권리와 Guard 검사</text><polyline points="715,210 715,275 170,275 170,335" fill="none" stroke="#486477" stroke-width="1.8" marker-end="url(#a)"/><polyline points="810,210 810,300 525,300 525,335" fill="none" stroke="#486477" stroke-width="1.8" marker-end="url(#a)"/><polyline points="910,210 910,335" fill="none" stroke="#486477" stroke-width="1.8" marker-end="url(#a)"/><text x="25" y="555.0" text-anchor="start" font-family="Noto Sans CJK KR" font-size="18" font-weight="700" fill="#203c50">빈 값은 ANY가 아니며 UNKNOWN은 지원 없음과 다르다</text><text x="25" y="590.0" text-anchor="start" font-family="Noto Sans CJK KR" font-size="16" font-weight="400" fill="#203c50">새 요청 보류 시 이미 동작 중인 기능은 승인된 기능별 유지 제한 중단 정책을 따른다</text></svg>