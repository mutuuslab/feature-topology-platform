<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="620" viewBox="0 0 1050 620" role="img"><title>stm 관리 상태와 차량 사실의 분리</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#486477"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="24" y="30.0" text-anchor="start" font-family="Noto Sans CJK KR" font-size="20" font-weight="700" fill="#203c50">stm 관리 상태와 차량 사실의 분리</text><rect x="30" y="70" width="990" height="140" fill="#eef4f8" stroke="#8299aa" stroke-width="1.5"/><text x="44" y="94.0" text-anchor="start" font-family="Noto Sans CJK KR" font-size="13" font-weight="400" fill="#496f83">«independent lifecycle»</text><text x="44" y="122.0" text-anchor="start" font-family="Noto Sans CJK KR" font-size="19" font-weight="700" fill="#203c50">Feature 정의 상태</text><path d="M30 135 H1020" stroke="#b4c4cf"/><text x="44" y="160.0" text-anchor="start" font-family="Noto Sans CJK KR" font-size="16" font-weight="400" fill="#203c50">초안 → 검토 → 정의 승인 → 사용 종료</text><rect x="30" y="240" width="990" height="140" fill="#f4f1e9" stroke="#8299aa" stroke-width="1.5"/><text x="44" y="264.0" text-anchor="start" font-family="Noto Sans CJK KR" font-size="13" font-weight="400" fill="#496f83">«independent lifecycle»</text><text x="44" y="292.0" text-anchor="start" font-family="Noto Sans CJK KR" font-size="19" font-weight="700" fill="#203c50">BOM 및 Catalog 상태</text><path d="M30 305 H1020" stroke="#b4c4cf"/><text x="44" y="330.0" text-anchor="start" font-family="Noto Sans CJK KR" font-size="16" font-weight="400" fill="#203c50">구성 작성 → 검증 → 승인 → 상품 발행</text><rect x="30" y="410" width="990" height="140" fill="#eaf4ef" stroke="#8299aa" stroke-width="1.5"/><text x="44" y="434.0" text-anchor="start" font-family="Noto Sans CJK KR" font-size="13" font-weight="400" fill="#496f83">«independent lifecycle»</text><text x="44" y="462.0" text-anchor="start" font-family="Noto Sans CJK KR" font-size="19" font-weight="700" fill="#203c50">차량 적용 관측 상태</text><path d="M30 475 H1020" stroke="#b4c4cf"/><text x="44" y="500.0" text-anchor="start" font-family="Noto Sans CJK KR" font-size="16" font-weight="400" fill="#203c50">미관측 UNKNOWN → 보고 수신 → 실제 상태와 신선도 확인</text><polyline points="860,210 860,240" fill="none" stroke="#486477" stroke-width="1.8" marker-end="url(#a)" stroke-dasharray="7 5"/><text x="735" y="233.0" text-anchor="start" font-family="Noto Sans CJK KR" font-size="14" font-weight="400" fill="#203c50">승인 참조</text><polyline points="860,380 860,410" fill="none" stroke="#486477" stroke-width="1.8" marker-end="url(#a)" stroke-dasharray="7 5"/><text x="677" y="403.0" text-anchor="start" font-family="Noto Sans CJK KR" font-size="14" font-weight="400" fill="#203c50">출시 의도만 연결</text><text x="30" y="597.0" text-anchor="start" font-family="Noto Sans CJK KR" font-size="19" font-weight="700" fill="#203c50">기능 정의 승인 ≠ 기술 구성 승인 ≠ 상품 발행 ≠ 실제 기능 활성</text></svg>