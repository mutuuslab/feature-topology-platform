<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="625" viewBox="0 0 1080 625" role="img"><title>국가와 Trim 및 Variant 조건 선택</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#476379"/></marker></defs><rect width="1080" height="625" fill="white"/><text x="20" y="32.0" font-family="Noto Sans CJK KR" font-size="24" font-weight="700" fill="#203c51">wireframe  국가와 Trim 및 Variant의 유효 조합</text><rect x="20" y="62" width="1040" height="102" rx="3" fill="#f0f5f9" stroke="#8fa8ba"/><text x="35" y="92.0" font-family="Noto Sans CJK KR" font-size="20" font-weight="700" fill="#203c51">적용 정보의 기준</text><path d="M20 108H1060" stroke="#a3b7c5"/><text x="35" y="136.0" font-family="Noto Sans CJK KR" font-size="18" font-weight="400" fill="#203c51">Profile 정확 버전  AP-EXAMPLE@1.0  |  국가 의미  기술 지원 시장  |  원천과 확인 시각 표시</text><rect x="20" y="188" width="80" height="50" fill="#e8f0f6" stroke="#b5c6d2"/><text x="30" y="219.0" font-family="Noto Sans CJK KR" font-size="18" font-weight="700" fill="#203c51">행</text><rect x="100" y="188" width="140" height="50" fill="#e8f0f6" stroke="#b5c6d2"/><text x="110" y="219.0" font-family="Noto Sans CJK KR" font-size="18" font-weight="700" fill="#203c51">국가</text><rect x="240" y="188" width="150" height="50" fill="#e8f0f6" stroke="#b5c6d2"/><text x="250" y="219.0" font-family="Noto Sans CJK KR" font-size="18" font-weight="700" fill="#203c51">차종</text><rect x="390" y="188" width="140" height="50" fill="#e8f0f6" stroke="#b5c6d2"/><text x="400" y="219.0" font-family="Noto Sans CJK KR" font-size="18" font-weight="700" fill="#203c51">연식</text><rect x="530" y="188" width="150" height="50" fill="#e8f0f6" stroke="#b5c6d2"/><text x="540" y="219.0" font-family="Noto Sans CJK KR" font-size="18" font-weight="700" fill="#203c51">Trim</text><rect x="680" y="188" width="160" height="50" fill="#e8f0f6" stroke="#b5c6d2"/><text x="690" y="219.0" font-family="Noto Sans CJK KR" font-size="18" font-weight="700" fill="#203c51">옵션 및 VC</text><rect x="840" y="188" width="220" height="50" fill="#e8f0f6" stroke="#b5c6d2"/><text x="850" y="219.0" font-family="Noto Sans CJK KR" font-size="18" font-weight="700" fill="#203c51">확인 상태</text><rect x="20" y="238" width="80" height="60" fill="#fff" stroke="#b5c6d2"/><text x="30" y="275.0" font-family="Noto Sans CJK KR" font-size="17" font-weight="400" fill="#203c51">1</text><rect x="100" y="238" width="140" height="60" fill="#fff" stroke="#b5c6d2"/><text x="110" y="275.0" font-family="Noto Sans CJK KR" font-size="17" font-weight="400" fill="#203c51">KR</text><rect x="240" y="238" width="150" height="60" fill="#fff" stroke="#b5c6d2"/><text x="250" y="275.0" font-family="Noto Sans CJK KR" font-size="17" font-weight="400" fill="#203c51">모델 A</text><rect x="390" y="238" width="140" height="60" fill="#fff" stroke="#b5c6d2"/><text x="400" y="275.0" font-family="Noto Sans CJK KR" font-size="17" font-weight="400" fill="#203c51">MY27</text><rect x="530" y="238" width="150" height="60" fill="#fff" stroke="#b5c6d2"/><text x="540" y="275.0" font-family="Noto Sans CJK KR" font-size="17" font-weight="400" fill="#203c51">Trim P</text><rect x="680" y="238" width="160" height="60" fill="#fff" stroke="#b5c6d2"/><text x="690" y="275.0" font-family="Noto Sans CJK KR" font-size="17" font-weight="400" fill="#203c51">OPT-X / VC1</text><rect x="840" y="238" width="220" height="60" fill="#fff" stroke="#b5c6d2"/><text x="850" y="275.0" font-family="Noto Sans CJK KR" font-size="17" font-weight="400" fill="#203c51">확인 완료</text><rect x="20" y="298" width="80" height="60" fill="#fff" stroke="#b5c6d2"/><text x="30" y="335.0" font-family="Noto Sans CJK KR" font-size="17" font-weight="400" fill="#203c51">2</text><rect x="100" y="298" width="140" height="60" fill="#fff" stroke="#b5c6d2"/><text x="110" y="335.0" font-family="Noto Sans CJK KR" font-size="17" font-weight="400" fill="#203c51">DE</text><rect x="240" y="298" width="150" height="60" fill="#fff" stroke="#b5c6d2"/><text x="250" y="335.0" font-family="Noto Sans CJK KR" font-size="17" font-weight="400" fill="#203c51">모델 B</text><rect x="390" y="298" width="140" height="60" fill="#fff" stroke="#b5c6d2"/><text x="400" y="335.0" font-family="Noto Sans CJK KR" font-size="17" font-weight="400" fill="#203c51">MY27</text><rect x="530" y="298" width="150" height="60" fill="#fff" stroke="#b5c6d2"/><text x="540" y="335.0" font-family="Noto Sans CJK KR" font-size="17" font-weight="400" fill="#203c51">Trim S</text><rect x="680" y="298" width="160" height="60" fill="#fff" stroke="#b5c6d2"/><text x="690" y="335.0" font-family="Noto Sans CJK KR" font-size="17" font-weight="400" fill="#203c51">OPT-Y / VC2</text><rect x="840" y="298" width="220" height="60" fill="#fff" stroke="#b5c6d2"/><text x="850" y="335.0" font-family="Noto Sans CJK KR" font-size="17" font-weight="400" fill="#203c51">검토 중</text><rect x="20" y="389" width="505" height="125" rx="3" fill="#edf6f3" stroke="#8fa8ba"/><text x="35" y="419.0" font-family="Noto Sans CJK KR" font-size="20" font-weight="700" fill="#203c51">조합 규칙</text><path d="M20 435H525" stroke="#a3b7c5"/><text x="35" y="463.0" font-family="Noto Sans CJK KR" font-size="18" font-weight="400" fill="#203c51">같은 행의 조건은 모두 충족해야 한다.</text><text x="35" y="489.64" font-family="Noto Sans CJK KR" font-size="18" font-weight="400" fill="#203c51">서로 다른 행 중 하나가 충족되면 된다.</text><rect x="555" y="389" width="505" height="125" rx="3" fill="#fff6e8" stroke="#8fa8ba"/><text x="570" y="419.0" font-family="Noto Sans CJK KR" font-size="20" font-weight="700" fill="#203c51">추가 선택의 검사</text><path d="M555 435H1060" stroke="#a3b7c5"/><text x="570" y="463.0" font-family="Noto Sans CJK KR" font-size="18" font-weight="400" fill="#203c51">KR와 모델 B를 새로 섞지 않는다.</text><text x="570" y="489.64" font-family="Noto Sans CJK KR" font-size="18" font-weight="400" fill="#203c51">Trim 또는 VC 미확인은 전체 지원이 아니다.</text><text x="20" y="555.0" font-family="Noto Sans CJK KR" font-size="18" font-weight="400" fill="#203c51">상품 범위는 기술 지원 범위 안에서 선택하고, 배포는 승인된 상품과 운영 범위 안에서 대상을 고정한다.</text><text x="20" y="587.0" font-family="Noto Sans CJK KR" font-size="18" font-weight="400" fill="#203c51">국가 코드는 공통 사전을 참조한다. 생산국과 판매국과 현재 운행국은 의미가 다른 조건이다.</text></svg>