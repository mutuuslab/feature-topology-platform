text><rect x="1005" y="320" width="395" height="155" rx="4" fill="#eff3f8" stroke="#71839a"/><text x="1020" y="345" font-family="Noto Sans CJK KR,Arial,sans-serif" font-size="16" fill="#21394e" font-weight="bold">«block» Governance+Monitoring</text><text x="1020" y="370" font-family="Noto Sans CJK KR,Arial,sans-serif" font-size="12" fill="#21394e" font-weight="normal">권한 · 운영 허가 · 감사 · 관측 · 사고</text><text x="1020" y="410" font-family="Noto Sans CJK KR,Arial,sans-serif" font-size="14" fill="#21394e" font-weight="normal">C11 C12 C23 C25 C36 C37 C49</text><text x="1020" y="440" font-family="Noto Sans CJK KR,Arial,sans-serif" font-size="14" fill="#21394e" font-weight="normal">허가·기간·대상과 실제 결과를 대조</text><rect x="35" y="580" width="600" height="180" rx="4" fill="#eff3f8" stroke="#71839a"/><text x="50" y="605" font-family="Noto Sans CJK KR,Arial,sans-serif" font-size="16" fill="#21394e" font-weight="bold">«block» Vehicle Plane</text><text x="50" y="630" font-family="Noto Sans CJK KR,Arial,sans-serif" font-size="12" fill="#21394e" font-weight="normal">SDK · Verified Cache · Evaluator · Local Guard</text><text x="50" y="670" font-family="Noto Sans CJK KR,Arial,sans-serif" font-size="15" fill="#21394e" font-weight="normal">AAOS 서비스 ↔ Gateway ↔ BDC 및 다른 ECU</text><text x="50" y="705" font-family="Noto Sans CJK KR,Arial,sans-serif" font-size="15" fill="#21394e" font-weight="normal">OEM·3rd party의 실행 책임과 관측 계약 유지</text><text x="50" y="736" font-family="Noto Sans CJK KR,Arial,sans-serif" font-size="13" fill="#21394e" font-weight="normal">desired ≠ delivered ≠ evaluated ≠ guarded ≠ observed</text><rect x="735" y="580" width="665" height="180" rx="4" fill="#eff3f8" stroke="#71839a"/><text x="750" y="605" font-family="Noto Sans CJK KR,Arial,sans-serif" font-size="16" fill="#21394e" font-weight="bold">«block» Transaction and Evidence</text><text x="750" y="630" font-family="Noto Sans CJK KR,Arial,sans-serif" font-size="12" fill="#21394e" font-weight="normal">동일 트랜잭션: 변경 + 명령 + 감사 + Outbox</text><text x="750" y="670" font-family="Noto Sans CJK KR,Arial,sans-serif" font-size="14" fill="#21394e" font-weight="normal">409 identity/state conflict · 412 If-Match mismatch</text><text x="750" y="705" font-family="Noto Sans CJK KR,Arial,sans-serif" font-size="14" fill="#21394e" font-weight="normal">외부 호출은 commit 후 · 수신 Inbox와 readback 상관</text><text x="750" y="736" font-family="Noto Sans CJK KR,Arial,sans-serif" font-size="14" fill="#21394e" font-weight="normal">ACK만으로 적용 성공을 생성하지 않음</text><path d="M465 150H530" fill="none" stroke="#425b76" stroke-width="2" marker-end="url(#a)"/><text x="478" y="135" font-family="Noto Sans CJK KR,Arial,sans-serif" font-size="12" fill="#21394e" font-weight="normal">의도</text><path d="M940 150H1005" fill="none" stroke="#425b76" stroke-width="2" marker-end="url(#a)"/><text x="952" y="135" font-family="Noto Sans CJK KR,Arial,sans-serif" font-size="12" fill="#21394e" font-weight="normal">참조</text><path d="M735 230V285H250V320" fill="none" stroke="#425b76" stroke-width="2" marker-end="url(#a)"/><text x="380" y="275" font-family="Noto Sans CJK KR,Arial,sans-serif" font-size="12" fill="#21394e" font-weight="normal">업무 요청</text><path d="M735 230V320" fill="none" stroke="#425b76" stroke-width="2" marker-end="url(#a)"/><text x="746" y="284" font-family="Noto Sans CJK KR,Arial,sans-serif" font-size="12" fill="#21394e" font-weight="normal">검증</text><path d="M850 230V260H1200V320" fill="none" stroke="#425b76" stroke-width="2" marker-end="url(#a)"/><text x="1207" y="275" font-family="Noto Sans CJK KR,Arial,sans-serif" font-size="12" fill="#21394e" font-weight="normal">권한</text><path d="M250 475V580" fill="none" stroke="#425b76" stroke-width="2" marker-end="url(#a)"/><text x="263" y="534" font-family="Noto Sans CJK KR,Arial,sans-serif" font-size="12" fill="#21394e" font-weight="normal">승인 정책 전달</text><path d="M635 670H735" fill="none" stroke="#425b76" stroke-width="2" marker-end="url(#a)"/><text x="643" y="654" font-family="Noto Sans CJK KR,Arial,sans-serif" font-size="12" fill="#21394e" font-weight="normal">상관 관측</text><path d="M1200 580V475" fill="none" stroke="#425b76" stroke-width="2" marker-end="url(#a)"/><text x="1213" y="534" font-family="Noto Sans CJK KR,Arial,sans-serif" font-size="12" fill="#21394e" font-weight="normal">실제 결과</text><text x="35" y="824" font-family="Noto Sans CJK KR,Arial,sans-serif" font-size="17" fill="#21394e" font-weight="bold">공식 4-Plane과 49 Core를 보존합니다. Knowledge Foundation은 공유 정보 기반입니다.</text><text x="35" y="862" font-family="Noto Sans CJK KR,Arial,sans-serif" font-size="15" fill="#21394e" font-weight="normal">단독 화면 설계와 제품 실행 증거를 분리합니다. Reference API는 OEM 안전 판단과 실제 시스템을 대체하지 않습니다.</text><text x="35" y="912" font-family="Noto Sans CJK KR,Arial,sans-serif" font-size="13" fill="#21394e" font-weight="normal">FP-DETAILED-1.1 · AR 4.5 / SW 4.6 / UX 4.6 / Topology 0.8 / UI 3.9</text></svg>