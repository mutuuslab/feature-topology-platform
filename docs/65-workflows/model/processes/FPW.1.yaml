process:
  id: FPW.1
  name: Feature Registration & Classification
  name_ko: Feature 등록·분류
  related: [FLW-FEATURE-REGISTER]
  gates: [G1]
  ref: 표준 보고서 5장(분류), 6.1절 G1, 6.4절 시나리오
  purpose_ko: >-
    통제할 Feature Version의 대상·소유자·적용 차량을 Registry에 등록하고, 네 축 안전 분류와 법규 등급을
    확정해 이후 모든 Gate가 같은 분류를 기준으로 판단하게 한다.
  outcomes:
    - {id: O1, text_ko: Feature Version이 소유자·대상 차량 사양·의존 관계와 함께 Registry에 등록된다.}
    - {id: O2, text_ko: F 등급·비활성화 등급·법규 등급·Flag 유형이 근거와 함께 확정된다.}
    - {id: O3, text_ko: G1 판정이 서명된 Decision Record로 남고 다음 단계(G2)로 넘어간다.}
  rules: [FFG-CLS-001, FFG-CLS-003, FFG-CLS-005, FFG-CLS-008, FFG-CLS-009, FFG-LCY-001, FFG-LCY-002]
  entry_criteria:
    - Feature 제안 또는 변경요청이 접수되어 담당 Feature Owner가 지정되었다
    - 대상 시장의 Compliance Profile 판이 고정되어 있다
  exit_criteria:
    - Feature Version이 PROPOSED 상태로 등록되고 네 축 분류가 Safety Manager 서명으로 확정되었다
    - 법규 의무 기능 여부가 판정되어 분류에 반영되었다
    - G1 Decision Record(판정·근거 Evidence·승인자 역할)가 남았다
  work_products:
    - key: WP-FEAT-PROPOSAL
      name: Feature 제안·변경요청
      en: Feature Proposal / Change Request
      kind: input
      from: 상품·도메인 기획, 변경요청(CR) 접수
      content:
        - 기능 목적과 사용자 가치, 대상 시장·차종
        - 관련 요구 ID(ALM)와 기존 Feature와의 관계
        - 희망 출시 시점과 판매 방식(구독·구매·체험)
    - key: WP-FEAT-REG
      name: Feature 등록 기록
      en: Feature Registry Entry
      kind: output
      content:
        - Feature ID·Version(PROPOSED 0.1.0)·소유자·설명
        - Flag 유형과 Release·Experiment Flag의 만료일·Retirement 계획
        - 관련 요구 ID와 판매 방식
    - key: WP-FEAT-SCOPE
      name: 대상 차량 사양·의존 관계
      en: Variant Scope & Dependencies
      kind: output
      content:
        - 적용 차종·Trim·시장과 지원 조건
        - 필요(REQUIRES)·배타(EXCLUDES) 의존 관계와 판정
        - Topology에서 위험 전파 관계가 있는 Feature 목록
    - key: WP-SAFETY-PROFILE
      name: 안전 분류(네 축)
      en: Safety Profile
      kind: output
      content:
        - F 등급과 판정 근거(위험 전파 관계 포함)
        - 비활성화 등급·Safe State·인계·감소 시간 프로파일
        - Safety Manager 개인 서명과 확정 시각
    - key: WP-REG-CLASS
      name: 법규 등급 판정 기록
      en: Regulatory Classification Record
      kind: output
      content:
        - 시장별 의무 기능 해당 여부와 근거 조항
        - 의무 기능일 때 DC4·R2 지정과 원격 요청 거부 대상 표시
    - key: WP-G1-DECISION
      name: G1 Decision Record
      en: G1 Decision Record
      kind: output
      content:
        - 판정(PASS·CONDITIONAL PASS·FAIL)과 근거 Evidence ID
        - 판정자 역할·서명·시각, 조건부 통과 시 기한과 책임자
  activities:
    - id: FPW.1-A01
      name: Feature 등록·초안 작성
      outcomes: [O1]
      rules: [FFG-CLS-008]
      raci: {R: [R-FO], A: R-FO, C: [R-ARC, R-REQ], I: [R-SM]}
      inputs: [WP-FEAT-PROPOSAL]
      outputs: [WP-FEAT-REG]
      steps:
        - 제안·변경요청을 검토해 기존 Feature의 새 Version인지 새 Feature인지 정한다
        - 'Feature 등록 화면에서 이름·설명·관련 요구 ID·판매 방식을 입력해 PROPOSED 초안을 만든다'
        - Flag 유형을 고르고, Release·Experiment Flag면 만료일과 Retirement 계획을 함께 적는다
        - 아키텍트·요구 Owner와 Control Point 후보와 요구 범위를 맞춘다
      checks:
        - Registry에 PROPOSED Version이 생기고 소유자가 지정되었다
        - 만료일이 필요한 Flag 유형에 만료일과 Retirement 계획이 비어 있지 않다
      platform:
        actions: [createFeature, createVersion, updateDraft]
        screens: [/master/define, /feature/propose, /features]
        anchor: feature-form
        ui: {fields: [name, description, ownerId], buttons: [createFeature]}
      sla_hours: 48
      next: [FPW.1-A02, FPW.1-A03]
    - id: FPW.1-A02
      name: 대상 차량 사양·의존 등록
      outcomes: [O1]
      rules: []
      raci: {R: [R-PLM], A: R-FO, C: [R-ARC], I: [R-SM]}
      inputs: [WP-FEAT-REG]
      outputs: [WP-FEAT-SCOPE]
      steps:
        - 적용 차종·Trim·시장을 PLM 기준정보와 대조해 지원 조건을 등록한다
        - 다른 Feature와의 필요·배타 관계를 등록하고 의존 판정 결과를 확인한다
        - Topology에서 위험 전파 관계가 있는 Feature를 찾아 분류 담당에게 넘긴다
      checks:
        - 모든 대상 Variant가 기준정보에 존재하고 의존 판정이 미판정으로 남지 않았다
      platform:
        actions: [createDependency]
        screens: [/variant-conditions, /arch/topology]
        anchor: variant-conditions
        ui: {fields: [featureId, version]}
      sla_hours: 24
      next: [FPW.1-A05]
    - id: FPW.1-A03
      name: 안전 분류(네 축) 확정
      outcomes: [O2]
      rules: [FFG-CLS-001, FFG-CLS-003, FFG-CLS-009]
      raci: {R: [R-SM], A: R-SM, C: [R-FO, R-ARC], I: [R-REQ]}
      inputs: [WP-FEAT-REG, WP-FEAT-SCOPE]
      outputs: [WP-SAFETY-PROFILE]
      steps:
        - F 등급·비활성화 등급·법규 등급·Flag 유형 네 축을 모두 채운다
        - 비활성화 등급과 F 등급이 서로 허용되는 조합인지, 시간 프로파일 값이 0보다 큰지 확인한다
        - 위험 전파 관계가 있는 Feature의 F 등급을 낮추는 경우 영향 재분석 결과를 붙인다
        - 확정 버튼으로 개인 서명해 분류를 고정한다. 확정 뒤에는 초안 수정이 막힌다
      checks:
        - 네 축 중 빈 값이 없고 분류 확정 서명이 남았다
        - F 등급 하향이면 재분석 Evidence가 연결되었다
      platform:
        actions: [updateSafetyProfile, confirmSafetyProfile]
        screens: [/features/:id/:ver]
        anchor: safety-tab
        ui: {buttons: [confirmSafetyProfile]}
      sla_hours: 48
      next: [FPW.1-A04]
    - id: FPW.1-A04
      name: 법규 의무 기능 판정
      outcomes: [O2]
      rules: [FFG-CLS-005]
      raci: {R: [R-REG], A: R-REG, C: [R-SM], I: [R-FO]}
      inputs: [WP-SAFETY-PROFILE, WP-COMPLIANCE-PROFILE]
      outputs: [WP-REG-CLASS]
      steps:
        - 대상 시장 Compliance Profile의 의무 기능 목록과 Feature 기능을 대조한다
        - 의무 기능이면 법규 등급과 비활성화 등급을 의무 기능 기준으로 지정하도록 Safety Manager에게 요청한다
        - 판정 근거 조항과 시장을 기록하고 Feature Owner에게 원격 요청 제한을 알린다
      checks:
        - 대상 시장마다 의무 기능 해당 여부가 기록되었다
      next: [FPW.1-A05]
    - id: FPW.1-A05
      name: G1 등록·분류 판정
      gate_decision: G1
      outcomes: [O3]
      rules: [FFG-LCY-001, FFG-LCY-002, FFG-CLS-001]
      raci: {R: [R-SM], A: R-SM, C: [R-FO, R-REG], I: [R-REQ, R-PLM, R-QA]}
      inputs: [WP-FEAT-REG, WP-FEAT-SCOPE, WP-SAFETY-PROFILE, WP-REG-CLASS]
      outputs: [WP-G1-DECISION]
      steps:
        - 등록 기록·대상 사양·분류·법규 판정이 모두 있는지 확인하고, 하나라도 없으면 FAIL로 판정한다
        - Feature Owner의 의견을 받아 판정(PASS·CONDITIONAL PASS·FAIL)과 근거 Evidence ID를 입력한다
        - 'Gate G1(Feature)·G3(Variant)을 개인 서명으로 판정 등록한다'
        - 조건부 통과면 기한과 책임자를 등록하고 요구 Owner에게 G2·G3 착수를 알린다
      checks:
        - Decision Record에 판정·근거 Evidence·판정자 역할·시각이 모두 있다
        - Feature 작성자와 판정자가 다른 사람이다
      platform: {actions: [judgeGate], screens: [/features/:id/:ver, /admin/approval], gates: [G1, G3]}
