process:
  id: FPW.3
  name: Safety Requirements Baseline
  name_ko: 안전요구 확정
  related: [FLW-FEATURE-REGISTER]
  gates: [G3]
  ref: 표준 보고서 6.1절 G3, 6장 FFG-LCY-004·005, 16장(ASPICE SYS.2·SWE.1)
  purpose_ko: >-
    HARA 결과로부터 검증 가능한 안전요구를 확정하고, Safety Goal부터 출시 Baseline까지 끊김 없이 추적되게
    한 뒤, Feature 정의(G1~G3)를 승인해 개발 단계로 넘긴다.
  outcomes:
    - {id: O1, text_ko: 비활성화 동작을 포함한 안전요구가 Safety Goal에서 도출된다.}
    - {id: O2, text_ko: F2 이상 Feature의 안전요구가 양방향으로 빠짐없이 추적된다.}
    - {id: O3, text_ko: 요구 검토가 판정되고 Feature 정의가 승인되어 APPROVED로 전이된다.}
  rules: [FFG-LCY-004, FFG-LCY-005, FFG-LCY-012]
  entry_criteria:
    - G2 판정이 PASS이고 HARA·TARA·SOTIF 결과가 현재 Version 기준이다
  exit_criteria:
    - 안전요구가 Feature Version에 연결되고 추적 단절이 없다
    - G3 판정과 정의 승인(PROPOSED→APPROVED)이 남았다
  work_products:
    - key: WP-SAFETY-REQ
      name: 안전요구·추적 연결
      en: Safety Requirements & Trace
      kind: output
      content:
        - Safety Goal부터 기능·기술·SW 안전요구까지의 도출 관계
        - 비활성화 등급·경고·인계·감소 시간·Safe State·끝 상태·운전자 정보 요구
        - 요구별 검증 기준과 ALM 요구 ID
    - key: WP-TRACE-REPORT
      name: 추적성 점검 결과
      en: Traceability Check Report
      kind: output
      content:
        - 요구↔설계↔시험↔Baseline 양방향 연결 현황
        - 끊긴 연결과 조치 담당
    - key: WP-REQ-REVIEW
      name: 요구 검토 판정 기록
      en: Requirement Review Record
      kind: output
      content:
        - 요구 특성(검증 가능성·일관성·완전성) 검토 결과
        - Requirement Gate 판정과 판정자 서명
    - key: WP-G3-DECISION
      name: G3 Decision Record·정의 승인
      en: G3 Decision Record & Definition Approval
      kind: output
      content:
        - G3 판정과 근거 Evidence ID
        - PROPOSED→APPROVED 전이 기록과 승인자(작성자와 다른 사람)
  activities:
    - id: FPW.3-A01
      name: 안전요구 도출·명세
      outcomes: [O1]
      rules: [FFG-LCY-005, FFG-LCY-012]
      raci: {R: [R-REQ], A: R-REQ, C: [R-SM, R-ARC], I: [R-TST, R-FO]}
      inputs: [WP-G2-DECISION, WP-HARA-TARA, WP-SOTIF-ANALYSIS]
      outputs: [WP-SAFETY-REQ]
      steps:
        - Safety Goal별로 기능·기술 안전요구를 도출하고 SW에 할당된 요구를 SW 안전요구로 나눈다
        - F2 이상 Feature는 비활성화 등급·경고·인계·감소 시간·Safe State·끝 상태·운전자 정보를 요구로 쓴다
        - 안전 관련 Flag·파라미터·임계값 변경은 소스 변경이 없어도 변경요청과 영향 분석을 붙인다
        - 요구마다 검증 기준을 적고 ALM 요구 ID로 등록한다
      checks:
        - 모든 Safety Goal에 하나 이상의 안전요구가 있고 요구마다 검증 기준이 있다
      platform: {screens: [/trace/design, /change/cr]}
      next: [FPW.3-A02]
    - id: FPW.3-A02
      name: 양방향 추적성 점검
      outcomes: [O2]
      rules: [FFG-LCY-004]
      raci: {R: [R-REQ], A: R-REQ, C: [R-ARC, R-TST], I: [R-SM]}
      inputs: [WP-SAFETY-REQ]
      outputs: [WP-TRACE-REPORT]
      steps:
        - 요구·안전 추적 화면에서 Safety Goal→요구→설계→시험→Baseline 연결을 양방향으로 확인한다
        - 끊긴 연결마다 조치 담당과 기한을 지정한다
        - F2 이상 Feature에 연결되지 않은 요구가 남아 있으면 판정 요청을 보류한다
      checks:
        - F2 이상 Feature의 끊긴 연결이 0건이다
      platform: {screens: [/trace/design]}
      next: [FPW.3-A03]
    - id: FPW.3-A03
      name: 요구 검토 판정 등록
      outcomes: [O3]
      rules: [FFG-LCY-001]
      independent_of: [FPW.3-A01]
      raci: {R: [R-QA], A: R-REQ, C: [R-SM], I: [R-FO]}
      inputs: [WP-SAFETY-REQ, WP-TRACE-REPORT]
      outputs: [WP-REQ-REVIEW]
      steps:
        - 요구 특성(검증 가능성·일관성·완전성)을 체크리스트로 검토한다
        - 결과를 플랫폼 Requirement Gate에 판정으로 등록한다
        - 결함이 있으면 요구 Owner에게 돌려보내고 재검토 일정을 잡는다
      checks:
        - 검토자가 요구 작성자와 다른 조직이다
      platform: {actions: [judgeGate], screens: [/features/:id/:ver], gates: [G2]}
      next: [FPW.3-A04]
    - id: FPW.3-A04
      name: G3 판정·Feature 정의 승인
      gate_decision: G3
      outcomes: [O3]
      rules: [FFG-LCY-001, FFG-LCY-002]
      raci: {R: [R-REQ], A: R-REQ, C: [R-SM, R-FO], I: [R-ARC, R-PLM, R-TST]}
      inputs: [WP-REQ-REVIEW, WP-G1-DECISION, WP-G2-DECISION]
      outputs: [WP-G3-DECISION]
      steps:
        - G1·G2·Requirement Gate 판정이 모두 PASS(또는 기한 있는 조건부)인지 확인하고 하나라도 없으면 승인하지 않는다
        - 판정 근거를 정리해 G3 판정을 남긴다
        - Lifecycle을 PROPOSED에서 APPROVED로 전이한다. 작성자는 이 전이를 할 수 없다
        - 아키텍트와 기준정보 담당에게 설계·Control Point 작업 시작을 알린다
      checks:
        - Feature Version이 APPROVED이고 승인자가 Feature 작성자와 다르다
      platform: {actions: [transition], screens: [/features/:id/:ver, /admin/approval]}
