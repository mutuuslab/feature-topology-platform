process:
  id: FPW.4
  name: Safety Design & Policy Design
  name_ko: 안전 설계·정책 설계
  related: [FLW-VARIANT-AUTHOR]
  gates: [G4]
  ref: 표준 보고서 6.1절 G4, 6장 FFG-LCY-006, 7.7절 FFG-DEAC-001, 8장(정책·TCL), 13장 FFG-TEL-007
  purpose_ko: >-
    안전요구를 차량 내 감시·Safety Guard 동작·플랫폼 정책과 Control Point 설계로 구현하고, 정책을 분야별로
    검증·승인한 뒤 독립 검토자가 설계 적합성(G4)을 판정하게 한다.
  outcomes:
    - {id: O1, text_ko: F2 이상 Feature의 고장 대응이 차량 내부 감시와 안전기제로 설계된다.}
    - {id: O2, text_ko: 플랫폼 컴포넌트의 도구 신뢰도(TCL)와 확보 방법이 정해진다.}
    - {id: O3, text_ko: Flag 정책이 작성·검증되고 작성자가 아닌 승인자가 승인한다.}
    - {id: O4, text_ko: 독립 검토로 G4 설계 판정이 남는다.}
  rules: [FFG-LCY-006, FFG-DEAC-001, FFG-TEL-007, FFG-PLT-013, FFG-CLS-002, FFG-LCY-001]
  entry_criteria:
    - Feature Version이 APPROVED이고 안전요구가 추적 연결되어 있다
  exit_criteria:
    - 설계서·정책이 승인되고 정책 해시가 고정되었다
    - G4 Decision Record가 독립 검토자 판정으로 남았다
  work_products:
    - key: WP-SAFETY-DESIGN
      name: 안전 설계서
      en: Safety Design Specification
      kind: output
      content:
        - FTTI 안의 차량 내 고장 감지(독립 센서 plausibility 등)와 Safety Guard 보고 경로
        - 원격 Kill을 안전기제에 넣지 않았다는 근거와 차량 내부 안전기제
        - 텔레메트리 도착 여부가 안전 판정에 영향을 주지 않는 구조
        - Control Point와 Flag가 상속하는 ASIL
    - key: WP-TCL-RECORD
      name: 플랫폼 도구 신뢰도(TCL) 기록
      en: Tool Confidence Record
      kind: output
      content:
        - 컴포넌트별 오류 출력 유형과 TI·TD·TCL
        - TD1 주장 시 출력 유형별 검출 수단
        - TCL2 이상 컴포넌트의 신뢰도 확보 방법
    - key: WP-POLICY
      name: Flag 정책(검증·승인본)
      en: Flag Policy
      kind: output
      content:
        - 대상 규칙·Variant 조건·기본값과 개정 번호
        - 분야별 검증 8종 결과와 배포 안전성 판정
        - 승인자·정책 해시·승인 시각
    - key: WP-G4-DECISION
      name: G4 Decision Record
      en: G4 Decision Record
      kind: output
      content:
        - 설계 적합성 판정과 근거 Evidence ID
        - 독립 검토자 서명과 아키텍트 책임 확인
  activities:
    - id: FPW.4-A01
      name: 차량 내 감시·안전기제 설계
      outcomes: [O1]
      rules: [FFG-LCY-006, FFG-DEAC-001, FFG-TEL-007, FFG-CLS-002]
      raci: {R: [R-ARC], A: R-ARC, C: [R-SM, R-INT], I: [R-TST, R-REQ]}
      inputs: [WP-G3-DECISION, WP-SAFETY-REQ]
      outputs: [WP-SAFETY-DESIGN]
      steps:
        - F2 이상 Feature가 FTTI 안에서 자기 고장을 감지해 Safety Guard에 보고하는 감시 구조를 설계한다
        - 원격 Kill은 FTTI 밖의 요청 경로로만 두고 FTTI 안의 대응은 차량 내부 안전기제로 설계한다
        - 텔레메트리가 늦거나 오지 않아도 차량 안전 판정이 바뀌지 않게 데이터 경로를 분리한다
        - 안전 거동을 바꾸는 Flag와 전달 경로가 사용 SW의 최고 ASIL을 상속하도록 Control Point를 정의한다
      checks:
        - 안전요구마다 설계 요소가 연결되었다
        - 원격 Kill이 안전기제로 쓰인 곳이 없다
      platform: {screens: [/master/control-points, /trace/design]}
      next: [FPW.4-A03]
    - id: FPW.4-A02
      name: 플랫폼 도구 신뢰도 분류
      trigger: 설계 착수 또는 사용 플랫폼 컴포넌트 변경
      outcomes: [O2]
      rules: [FFG-PLT-013]
      raci: {R: [R-SM], A: R-SM, C: [R-ARC, R-CSM], I: [R-QA]}
      inputs: [WP-SAFETY-REQ]
      outputs: [WP-TCL-RECORD]
      steps:
        - 이 Feature가 쓰는 플랫폼 컴포넌트마다 오류 출력 유형과 TI·TD를 정해 TCL을 기록한다
        - TD1은 출력 유형별 검출 수단을 지정할 수 있을 때만 주장하고, 서명 서비스에는 쓰지 않는다
        - TCL2 이상 컴포넌트의 신뢰도 확보 방법을 Safety Plan에 넣는다
      checks:
        - 사용 컴포넌트 모두에 TCL과 확보 방법이 있다
      platform: {screens: [/arch/components]}
      next: [FPW.4-A05]
    - id: FPW.4-A03
      name: Flag 정책 작성·검증
      outcomes: [O3]
      rules: [FFG-CLS-002]
      raci: {R: [R-ARC], A: R-ARC, C: [R-PLM, R-FO], I: [R-REQ]}
      inputs: [WP-SAFETY-DESIGN, WP-FEAT-SCOPE]
      outputs: [WP-POLICY]
      steps:
        - 대상 규칙·Variant 조건·기본값을 정책으로 작성한다
        - 분야별 검증 8종을 실행해 배포 안전성 판정을 받는다
        - 수정하면 새 개정본이 되므로 다시 검증한다
      checks:
        - 최신 개정본의 분야별 검증이 모두 통과했다
      platform: {actions: [createPolicy, updatePolicy, validatePolicy], screens: [/policies/new, /policies]}
      next: [FPW.4-A04]
    - id: FPW.4-A04
      name: 정책 승인
      outcomes: [O3]
      rules: []
      raci: {R: [R-REQ], A: R-REQ, C: [R-SM], I: [R-ARC, R-REL]}
      inputs: [WP-POLICY]
      outputs: [WP-POLICY]
      steps:
        - 승인 대상 개정본의 해시와 배포 안전성 판정(GO)을 확인한다
        - 정책 작성자가 아닌 사람이 승인 또는 반려한다
        - 반려하면 사유를 남겨 아키텍트에게 돌려보낸다
      checks:
        - 승인자가 정책 작성자와 다르고 승인 해시가 최신 개정본과 같다
      platform: {actions: [decidePolicy], screens: [/policies/:id]}
      next: [FPW.4-A05]
    - id: FPW.4-A05
      name: G4 설계 독립 검토·판정
      gate_decision: G4
      outcomes: [O4]
      rules: [FFG-LCY-001]
      independent_of: [FPW.4-A01, FPW.4-A03]
      raci: {R: [R-QA], A: R-ARC, C: [R-SM, R-CSM], I: [R-TST, R-FO]}
      inputs: [WP-SAFETY-DESIGN, WP-TCL-RECORD, WP-POLICY]
      outputs: [WP-G4-DECISION]
      steps:
        - 설계·정책·인터페이스가 안전요구를 충족하는지 설계 작성자와 다른 검토자가 확인한다
        - 판정을 플랫폼 Control Gate와 Safety/Security Gate에 개인 서명으로 등록한다
        - 아키텍트가 판정에 대한 설계 책임을 확인하고, FAIL이면 수정 항목을 설계로 돌려보낸다
      checks:
        - 검토자가 설계·정책 작성자와 다른 조직이다
        - Decision Record에 판정·근거 Evidence·판정자 역할·시각이 모두 있다
      platform: {actions: [judgeGate], screens: [/features/:id/:ver, /admin/approval], gates: [G4, G7]}
