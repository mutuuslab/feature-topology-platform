process:
  id: FPW.6
  name: Signed Deployment
  name_ko: 서명 배포
  related: [FLW-RELEASE-READINESS, INT-OTA]
  gates: [G6]
  ref: 표준 보고서 6.1절 G6, 6장 FFG-LCY-008·009, 8장(보안 배포), 15장(SBOM)
  purpose_ko: >-
    검증을 마친 Feature Version의 출시 Baseline을 확정하고, 서명된 패키지를 SUMS 기록과 함께 대상 차량에
    전달할 수 있는 상태로 배포한다. 패키지 전달(G6)은 차량 내 효력(G7)과 따로 승인한다.
  outcomes:
    - {id: O1, text_ko: 출시 Baseline이 요청자와 다른 승인자에 의해 확정된다.}
    - {id: O2, text_ko: Flag·파라미터 변경 명령이 SW 업데이트로 SUMS에 기록된다.}
    - {id: O3, text_ko: 서명·SBOM이 결합된 패키지가 OTA Gate를 거쳐 서버에 배포된다.}
  rules: [FFG-LCY-008, FFG-LCY-009, FFG-GEN-006, FFG-LCY-001]
  entry_criteria:
    - G5 판정이 PASS이고 승인된 정책 개정본이 있다
    - 형식승인 영향 판단이 끝났다
  exit_criteria:
    - 출시 Baseline이 확정되고 SUMS 기록이 남았다
    - 서명된 정책이 서버에 배포되고 Unleash와 동기화되었다(차량 내 효력은 아직 없음)
  work_products:
    - key: WP-BASELINE-REQ
      name: Baseline 확정 요청
      en: Baseline Request
      kind: output
      content:
        - 포함 Feature Version·정책 개정본·Artifact 목록
        - 요청자와 요청 사유
    - key: WP-RELEASE-BASELINE
      name: 출시 Baseline
      en: Release Baseline
      kind: output
      content:
        - 확정된 BOM 구성(Feature·SW·Variant)과 해시
        - 승인자(요청자와 다른 사람)·승인 시각
    - key: WP-SUMS-RECORD
      name: SUMS 업데이트 기록
      en: SUMS Update Record
      kind: output
      content:
        - 대상 RXSWIN과 형식승인 영향 평가 결과
        - 사용자 고지 내용과 시장별 보존 기간
    - key: WP-SIGNED-PACKAGE
      name: 서명 배포 패키지
      en: Signed Deployment Package
      kind: output
      content:
        - 정책·설정 Artifact와 서명, 대상 해시
        - 결합된 SBOM과 패키지 식별자
        - 실제 SW 원문 길이·SHA-256·구성품과 등록자/독립 검토자
    - key: WP-OTA-GATE
      name: OTA Gate 판정 기록
      en: OTA Gate Record
      kind: output
      content:
        - R156 사전조건·대상·호환성 확인 결과
        - 판정자 서명과 시각
    - key: WP-G6-DECISION
      name: G6 배포 기록
      en: G6 Deployment Record
      kind: output
      content:
        - 서버 배포(평가 기준 전환) 시각과 게시본 ID
        - Unleash 동기화 결과(flag·전략·환경)
        - Release Manager 판정과 근거 Evidence ID
    - key: WP-REPO-CONNECTION
      name: 코드 저장소 연결·변경 기록
      en: 코드 저장소 연결·변경 기록
      kind: output
      content:
        - 저장소·패키지·기본 브랜치와 스캔 설정
        - webhook·서명 검증의 상태와 실패 조치
        - 변경 사유·권한 있는 수행자·시각
      retained: true

  activities:
    - id: FPW.6-A01
      name: 출시 Baseline 확정 요청
      outcomes: [O1]
      rules: []
      raci: {R: [R-FO], A: R-FO, C: [R-REL, R-ARC], I: [R-PLM]}
      inputs: [WP-G5-DECISION, WP-POLICY]
      outputs: [WP-BASELINE-REQ]
      steps:
        - G5 판정을 받은 Feature Version과 승인된 정책 개정본으로 출시 구성을 정한다
        - BOM 기준선 화면에서 Baseline 확정을 요청한다
        - 요청자는 같은 Baseline의 승인자로 지정하지 않는다
      checks:
        - 요청에 포함 Version·정책 개정본·Artifact가 빠짐없이 있다
      platform:
        actions: [requestBaseline]
        screens: [/baselines]
      sla_hours: 24
      next: [FPW.6-A02]
    - id: FPW.6-A02
      name: 출시 Baseline 확정 승인
      outcomes: [O1]
      rules: []
      raci: {R: [R-PLM], A: R-PLM, C: [R-REL], I: [R-FO, R-REG]}
      inputs: [WP-BASELINE-REQ]
      outputs: [WP-RELEASE-BASELINE]
      steps:
        - 요청된 구성이 PLM 기준정보(차종·Variant·SW)와 일치하는지 대조한다
        - 일치하면 확정 승인하고, 다르면 사유를 남겨 반려한다
        - 확정된 Baseline 해시를 Release Manager에게 알린다
      checks:
        - 승인자가 요청자와 다르고 Baseline 해시가 고정되었다
      platform:
        actions: [decideBaseline]
        screens: [/baselines, /config/compat]
        anchor: baseline-approve
      sla_hours: 24
      next: [FPW.6-A03, FPW.6-A04]
    - id: FPW.6-A03
      name: SUMS 기록·형식승인 확인
      outcomes: [O2]
      rules: [FFG-LCY-008, FFG-GEN-006]
      raci: {R: [R-REG], A: R-REG, C: [R-REL], I: [R-FO, R-OPS]}
      inputs: [WP-RELEASE-BASELINE, WP-HOMOLOGATION-IMPACT]
      outputs: [WP-SUMS-RECORD]
      steps:
        - Flag·파라미터를 바꾸는 명령을 SW 업데이트로 보고 대상 RXSWIN과 형식승인 영향 평가를 SUMS에 기록한다
        - 형식승인 영향이 있으면 승인 기관의 개정·확장 결정이 나왔는지 확인하고, 없으면 배포를 보류시킨다
        - 사용자 고지 내용과 가장 긴 시장 요건의 보존 기간을 기록한다
      checks:
        - SUMS 기록에 RXSWIN·영향 평가·고지 내용·보존 기간이 있다
      next: [FPW.6-A05]
    - id: FPW.6-A04
      name: 서명 패키지 작성·SBOM 결합
      outcomes: [O3]
      rules: []
      raci: {R: [R-INT], A: R-REL, C: [R-PKI, R-CSM], I: [R-QA]}
      inputs: [WP-RELEASE-BASELINE]
      outputs: [WP-SIGNED-PACKAGE]
      steps:
        - 확정 Baseline의 정책·설정 Artifact를 묶고, SW가 포함되면 Feature Version의 실제 SW 구성품에 원문을 업로드해 길이·SHA-256을 대조한다
        - PKI 운영이 관리하는 배포 용도 서명 키로 서명을 요청하고, 다른 용도의 키는 쓰지 않는다
        - SBOM을 결합하고 CI/CD 변경 기록을 플랫폼에 등록한다
      checks:
        - 패키지 서명이 배포 용도 키로 검증되고 SBOM이 결합되었다
      platform: {actions: [registerChangeRecord, uploadSoftware, createSoftwarePackage], screens: [/deployments, /master/artifacts, /deployments/software]}
      next: [FPW.6-A05]
    - id: FPW.6-A05
      name: OTA Gate 판정 등록
      outcomes: [O3]
      rules: [FFG-LCY-001]
      raci: {R: [R-QA], A: R-REL, C: [R-REG, R-CSM], I: [R-OPS]}
      inputs: [WP-SIGNED-PACKAGE, WP-SUMS-RECORD]
      outputs: [WP-OTA-GATE]
      steps:
        - R156 사전조건(대상 식별·호환성·사용자 고지 준비)을 확인한다
        - 서명·해시 검증 결과와 SUMS 기록을 근거로 OTA Gate를 판정 등록한다
        - FAIL이면 사유를 Release Manager에게 돌려보낸다
      checks:
        - 판정 근거에 서명 검증·SUMS 기록 ID가 있다
      platform: {actions: [judgeGate], screens: [/features/:id/:ver], gates: [G8]}
      next: [FPW.6-A06]
    - id: FPW.6-A06
      name: G6 서명 배포 실행
      gate_decision: G6
      outcomes: [O3]
      rules: [FFG-LCY-009]
      raci: {R: [R-REL], A: R-REL, C: [R-OPS], I: [R-FO, R-SM, R-QA]}
      inputs: [WP-OTA-GATE, WP-RELEASE-BASELINE]
      outputs: [WP-G6-DECISION]
      steps:
        - SW 원문을 함께 전달하면 등록자와 다른 출시 담당자가 원문·구성품을 검토해 서명 매니페스트와 실제 파일 해시의 SBOM을 승인한다
        - OTA Gate PASS를 확인하고 정책을 서버에 배포해 평가 기준을 전환한다
        - Unleash와 flag·태그·의존·전략·환경을 동기화하고 결과를 확인한다
        - 이 배포는 패키지 전달까지이며, 차량 내 효력은 G7 승인 뒤 Canary부터 낸다고 운영 조직에 알린다
      checks:
        - 게시본 ID와 Unleash 동기화 결과가 G6 배포 기록에 있다
      platform: {actions: [reviewSoftwarePackage, deployPolicy, syncUnleash], screens: [/deployments, /deployments/software, /integration/connectors, /ops/ota-installs, '/deployments/campaigns/:id']}
      next: [FPW.6-A07]
    - id: FPW.6-A07
      name: 코드 저장소 연결 관리
      outcomes: [O1]
      rules: []
      raci: {R: [R-REL], A: R-REL, C: [R-INT], I: [R-ARC]}
      inputs: []
      outputs: [WP-REPO-CONNECTION]
      steps:
        - 차량 SW 저장소를 패키지·기본 브랜치·스캔 주기와 함께 연결한다
        - webhook 실패와 스캔 거부를 확인하고 원인을 통합 조직과 해소한다
        - 설정 변경은 사유를 남기고 구현 담당이 자기 검사를 약화하지 못하게 한다
      checks:
        - 연결 저장소의 webhook이 정상이고 최근 스캔이 서명 확인됐다
      platform: {actions: [createFlagRepository, updateFlagRepository], screens: [/integration/code-repositories, '/integration/code-repositories/:repoId', /integration/code-scans]}

  base_practices:
    - id: FPW.6.BP1
      name: 출시 Baseline 확정 요청
      definition_ko: 검증된 Feature Version과 승인 정책으로 출시 구성을 식별하고 필요한 Artifact를 갖춘 Baseline 확정을 요청한다. 요청 범위를
        고정하고 요청자와 승인자의 분리를 유지한다.
      notes: []
      activity_ids:
        - FPW.6-A01
      outcomes:
        - O1
      evidence:
        - work_product: WP-BASELINE-REQ
          outcomes:
            - O1
    - id: FPW.6.BP2
      name: 출시 Baseline 확정 승인
      definition_ko: 요청된 출시 구성이 차량 사양·SW·Variant 기준정보와 일치하는지 검토한다. 다른 승인자가 확정 또는 반려하고 확정된 해시와 구성을 출시 담당자에게
        전달한다.
      notes: []
      activity_ids:
        - FPW.6-A02
      outcomes:
        - O1
      evidence:
        - work_product: WP-RELEASE-BASELINE
          outcomes:
            - O1
    - id: FPW.6.BP3
      name: SUMS 기록·형식승인 확인
      definition_ko: 확정 구성과 형식승인 영향 판단을 SUMS 기록에 연결한다. 필요한 기관 결정·사용자 고지·보존 조건이 준비되었는지 확인하고 미해결 사항은 배포 준비
        판단에 반영한다.
      notes: []
      activity_ids:
        - FPW.6-A03
      outcomes:
        - O2
      evidence:
        - work_product: WP-SUMS-RECORD
          outcomes:
            - O2
    - id: FPW.6.BP4
      name: 서명 패키지 작성·SBOM 결합
      definition_ko: 확정된 정책·설정 Artifact와 SBOM을 하나의 배포 단위로 식별한다. 용도가 맞는 키의 서명과 해시를 확인하고 변경 기록을 통해 원본 구성과
        게시 패키지를 추적한다.
      notes: []
      activity_ids:
        - FPW.6-A04
      outcomes:
        - O3
      evidence:
        - work_product: WP-SIGNED-PACKAGE
          outcomes:
            - O3
    - id: FPW.6.BP5
      name: OTA Gate 판정 등록
      definition_ko: 대상 식별·호환성·고지·서명·SUMS의 사전조건을 평가한다. 근거에 연결된 OTA 판정을 남기고 부족한 조건과 보완 책임을 출시 담당자에게 전달한다.
      notes: []
      activity_ids:
        - FPW.6-A05
      outcomes:
        - O3
      evidence:
        - work_product: WP-OTA-GATE
          outcomes:
            - O3
    - id: FPW.6.BP6
      name: G6 서명 배포 실행
      definition_ko: 승인된 정책과 OTA 사전조건을 확인하여 서버 평가 기준과 외부 정책 도구를 일치시킨다. 서명 게시본·배포 결과를 기록하고 정책 전달과 차량 내 활성화의
        차이를 운영 조직에 알린다.
      notes:
        - 열린 재-HARA는 출시 전이·Release Sign-off를 막으며 승인된 완화 정책의 배포 자체를 막지 않는다는 D-RD-6 경계를 따른다.
      activity_ids:
        - FPW.6-A06
      outcomes:
        - O3
      evidence:
        - work_product: WP-G6-DECISION
          outcomes:
            - O3
    - id: FPW.6.BP7
      name: 코드 저장소 연결 관리
      definition_ko: 차량 SW 저장소의 패키지·기본 브랜치·스캔·webhook 연결을 통제한다. 설정 변경과 실패 원인을 기록하고 구현 담당자가 자기 검사를 약화시키지
        못하도록 변경 책임을 분리한다.
      notes: []
      activity_ids:
        - FPW.6-A07
      outcomes:
        - O1
      evidence:
        - work_product: WP-REPO-CONNECTION
          outcomes:
            - O1
