process:
  id: FPW.7
  name: Release, Activation & Staged Rollout
  name_ko: 출시·활성화·단계적 확대
  related: [FLW-RELEASE-READINESS, INT-UNLEASH]
  gates: [G7]
  ref: 표준 보고서 6.1절 G7, 6장 FFG-LCY-009·010, 12장 FFG-TST-010, 14장(SOTIF), 3장(ADS Safety Case), 5장 FFG-CLS-006
  purpose_ko: >-
    배포된 Feature Version을 차량 안에서 효력을 내도록 허가한다. SOTIF 출시 기준과 Safety Case 독립 검토,
    Canary·Shadow 판정 기준, 상품 구성 승인, 형식승인·사용자 고지 조건을 확인한 뒤 Canary Cohort부터 단계적으로 넓힌다.
  outcomes:
    - {id: O1, text_ko: Canary·Shadow 판정 기준과 실험 계획이 안전 등급에 맞게 정해진다.}
    - {id: O2, text_ko: SOTIF 출시 근거와 Safety Case가 정리되고 편향 없는 검토자가 검토한다.}
    - {id: O3, text_ko: 상품 구성이 작성자와 다른 승인자에게 승인되고 고객 출시는 다시 다른 승인자가 승인한다.}
    - {id: O4, text_ko: 형식승인·사용자 고지 조건을 확인한 G7 판정과 출시 전이가 남는다.}
    - {id: O5, text_ko: 효력이 Canary Cohort부터 관측 기준을 만족할 때만 넓어진다.}
  rules: [FFG-TST-010, FFG-LCY-009, FFG-CLS-006, FFG-SOT-004, FFG-SOT-005, FFG-ADS-008, FFG-ADS-012,
          FFG-GEN-006, FFG-LCY-010, FFG-LCY-001]
  entry_criteria:
    - G6 배포가 끝나 서버에 정책이 게시되었다(차량 내 효력 없음)
  exit_criteria:
    - G7 판정과 VERIFIED→RELEASED 전이가 남았다
    - Canary 관측 결과에 따라 확대 또는 중단 결정이 기록되었다
  work_products:
    - key: WP-CANARY-PLAN
      name: Canary·Shadow 판정 기준
      en: Canary / Shadow Criteria
      kind: output
      content:
        - Cohort별 차량 수·관측 기간·허용 차이·중단 기준
        - Shadow 출력이 제어기에 전달되지 않는다는 확인
    - key: WP-EXPERIMENT-PLAN
      name: 실험 계획
      en: Experiment Plan
      kind: output
      content:
        - 실험 목적·지표·기간과 대상 Cohort
        - F2 이상이면 Shadow 방식과 비간섭 입증 근거
    - key: WP-SAFETY-CASE
      name: Safety Case·SOTIF 출시 근거
      en: Safety Case & SOTIF Release Argument
      kind: output
      content:
        - 주장·논거·증거와 고유 식별자(규칙 ID·시험 ID 재사용)
        - ISO 21448 출시 기준 충족 근거와 잔여 위험
    - key: WP-SC-REVIEW
      name: Safety Case 독립 검토 기록
      en: Safety Case Independent Review
      kind: output
      content:
        - 검토자 자격·검토 기간·대상 Version(Safety Case·도구·ADS)
        - 검토 방법·재현한 증거·공백과 불확실 영역·개선 조치
    - key: WP-PRODUCT
      name: 상품 구성안
      en: Product Composition
      kind: output
      content:
        - 상품에 포함되는 Feature와 판매 방식(구독·구매·체험)
        - 구성 검증 결과와 체험 제안 조건
    - key: WP-PRODUCT-APPROVAL
      name: 상품 구성 승인 기록
      en: Product Composition Approval
      kind: output
      content:
        - 구성 승인자(상품 작성자와 다른 사람)와 시각
    - key: WP-ACTIVATION-PRECHECK
      name: 활성화 조건 확인서
      en: Activation Precheck
      kind: output
      content:
        - 형식승인 기관 결정 여부와 근거
        - 시장별 사용자 고지·확인 준비와 '작동 중이 아닐 때 효력' 조건
    - key: WP-G7-DECISION
      name: G7 Decision Record
      en: G7 Decision Record
      kind: output
      content:
        - 출시·활성화 판정과 근거 Evidence ID(SOTIF·Safety Case·Canary 기준)
        - Safety Manager 판정 서명, Feature Owner 출시 책임 확인
    - key: WP-RELEASE-SIGNOFF
      name: Release Sign-off 기록
      en: Release Sign-off
      kind: output
      content:
        - Feature Owner 개인 서명·서명 시각·소유 조직
        - 서명 시점의 G8·G9 판정 기록 ID(다시 판정되면 효력 없음)
    - key: WP-RELEASE-RECORD
      name: 출시 전이 기록
      en: Release Transition Record
      kind: output
      content:
        - VERIFIED→RELEASED 전이 시각과 수행자
    - key: WP-PRODUCT-RELEASE
      name: 상품 고객 출시 기록
      en: Product Customer Release
      kind: output
      retained: true
      content:
        - 고객 출시 승인자(구성 승인자와 다른 사람)와 시각
    - key: WP-ROLLOUT-RECORD
      name: 단계적 확대 기록
      en: Staged Rollout Record
      kind: output
      content:
        - Cohort 단계별 적용 시각·관측 결과
        - 확대·중단 결정과 근거
  activities:
    - id: FPW.7-A01
      name: Canary·Shadow 판정 기준 정의
      outcomes: [O1]
      rules: [FFG-TST-010, FFG-LCY-009]
      raci: {R: [R-OPS], A: R-OPS, C: [R-SM, R-TST], I: [R-FO, R-REL]}
      inputs: [WP-G6-DECISION, WP-SAFETY-PROFILE]
      outputs: [WP-CANARY-PLAN]
      steps:
        - F2 이상 Feature는 Canary Cohort에서 시작하도록 단계별 차량 수와 관측 기간을 정한다
        - 단계마다 허용 차이와 중단 기준을 사전에 적고 Safety Manager와 합의한다
        - Shadow를 쓰면 출력이 제어기로 가지 않는 구성인지 시험 조직과 확인한다
      checks:
        - 모든 단계에 관측 기간·허용 차이·중단 기준이 있다
      platform: {screens: [/activation/decide]}
      next: [FPW.7-A08]
    - id: FPW.7-A02
      name: 효과 실험 계획 등록
      trigger: 출시 효과를 실험으로 비교해야 할 때
      outcomes: [O1]
      rules: [FFG-CLS-006]
      raci: {R: [R-FO], A: R-FO, C: [R-SM, R-OPS], I: [R-REL]}
      inputs: [WP-SAFETY-PROFILE]
      outputs: [WP-EXPERIMENT-PLAN]
      steps:
        - 실험 목적·지표·기간·Cohort를 정한다
        - F2 이상 Feature면 Experiment Flag 대신 Shadow 방식으로 바꾸고 비간섭 입증 계획을 붙인다
        - 실험을 등록하고 Release Manager에게 시작 시점을 알린다
      checks:
        - F2 이상 Feature에 Experiment Flag 실험이 등록되지 않았다
      platform: {actions: [createExperiment], screens: [/experiments]}
      next: [FPW.7-A08]
    - id: FPW.7-A03
      name: Safety Case·SOTIF 근거 정리
      trigger: G6 배포 완료
      outcomes: [O2]
      rules: [FFG-SOT-004, FFG-ADS-008]
      raci: {R: [R-SM], A: R-SM, C: [R-FO, R-TST], I: [R-QA]}
      inputs: [WP-SOTIF-ANALYSIS, WP-G5-EVIDENCE, WP-HARA-TARA]
      outputs: [WP-SAFETY-CASE]
      steps:
        - F2 이상 Feature의 ISO 21448 출시 기준 충족 근거와 잔여 위험을 정리한다
        - Safety Case의 주장마다 논거를, 논거마다 증거를 두고 규칙 ID·시험 ID를 식별자로 붙인다
        - 정리한 Safety Case를 독립 검토에 넘긴다
      checks:
        - 모든 주장에 논거와 증거가 하나 이상 있다
      platform: {screens: [/verify/evidence, /verify/compliance]}
      next: [FPW.7-A04]
    - id: FPW.7-A04
      name: Safety Case 독립 검토
      outcomes: [O2]
      rules: [FFG-ADS-012]
      independent_of: [FPW.7-A03]
      raci: {R: [R-QA], A: R-SM, C: [R-TST], I: [R-FO, R-REG]}
      inputs: [WP-SAFETY-CASE]
      outputs: [WP-SC-REVIEW]
      steps:
        - Safety Case를 만들지 않은 검토자가 검토 자격과 대상 Version(Safety Case·도구·ADS)을 기록한다
        - 증거 일부를 다시 실행해 재현하고, 공백과 불확실한 영역을 적는다
        - 발견사항의 개선 조치와 담당을 기록해 Safety Manager에게 넘긴다
      checks:
        - 검토 기록에 자격·기간·Version·방법·재현 증거·공백이 모두 있다
      next: [FPW.7-A08]
    - id: FPW.7-A05
      name: 상품 구성 작성
      trigger: G6 배포 완료
      outcomes: [O3]
      rules: []
      raci: {R: [R-PDA], A: R-PDA, C: [R-FO], I: [R-PO]}
      inputs: [WP-G6-DECISION]
      outputs: [WP-PRODUCT]
      steps:
        - 상품에 넣을 Feature와 판매 방식을 정해 상품을 등록한다
        - 구성 검증으로 Feature 간 의존·배타 충돌이 없는지 확인한다
        - 체험 제안 조건(대상·기간)을 정한다
      checks:
        - 구성 검증 결과에 충돌이 없다
      platform: {actions: [createProduct, validateComposition, offerTrials], screens: [/products/new, /entitlements]}
      next: [FPW.7-A06]
    - id: FPW.7-A06
      name: 상품 구성 승인
      outcomes: [O3]
      rules: []
      raci: {R: [R-PO], A: R-PO, C: [R-FO], I: [R-PDA]}
      inputs: [WP-PRODUCT]
      outputs: [WP-PRODUCT-APPROVAL]
      steps:
        - 상품 작성자가 아닌 상품 Owner가 구성과 판매 조건을 검토한다
        - 승인하면 구성 승인 전이를 하고, 반려하면 사유를 남긴다
        - 고객 출시 승인은 구성 승인자와 다른 사람이 하도록 승인 후보를 지정한다
      checks:
        - 구성 승인자가 상품 작성자와 다르다
      platform: {actions: [productTransition], screens: [/products/:id/:ver]}
      next: [FPW.7-A08]
    - id: FPW.7-A07
      name: 형식승인·사용자 고지 확인
      trigger: G6 배포 완료
      outcomes: [O4]
      rules: [FFG-GEN-006, FFG-LCY-010]
      raci: {R: [R-REG], A: R-REG, C: [R-LEG, R-FO], I: [R-OPS]}
      inputs: [WP-HOMOLOGATION-IMPACT, WP-SUMS-RECORD]
      outputs: [WP-ACTIVATION-PRECHECK]
      steps:
        - 형식승인 영향이 있는 변경이면 승인 기관의 개정·확장 결정이 나왔는지 확인한다
        - 시장 Profile이 요구하는 사용자 고지·확인 문구와 절차가 준비되었는지 확인한다
        - F2 이상 Feature의 활성화가 기능 작동 중이 아닐 때만 효력을 내는지 확인한다
      checks:
        - 활성화 조건 확인서에 기관 결정·고지 준비·효력 조건이 모두 있다
      next: [FPW.7-A08]
    - id: FPW.7-A08
      name: G7 출시·활성화 판정
      gate_decision: G7
      outcomes: [O4]
      rules: [FFG-SOT-005, FFG-SOT-004, FFG-LCY-001]
      raci: {R: [R-SM], A: R-FO, C: [R-OPS, R-REG], I: [R-REL, R-QA]}
      inputs: [WP-CANARY-PLAN, WP-EXPERIMENT-PLAN, WP-SC-REVIEW, WP-PRODUCT-APPROVAL, WP-ACTIVATION-PRECHECK]
      outputs: [WP-G7-DECISION]
      steps:
        - SOTIF 출시 근거·Safety Case 검토·Canary 기준·활성화 조건이 모두 있는지 확인하고 하나라도 없으면 FAIL로 판정한다
        - AI·ML 모델을 쓰는 Feature면 데이터·모델 수명주기 요구를 확인하고 모델 교체가 새 Version으로 관리되는지 본다
        - Safety Manager가 Operations Gate에 판정을 등록하고, Feature Owner에게 Release Sign-off를 요청한다
      checks:
        - Decision Record에 판정·근거 Evidence·판정자 역할·시각이 모두 있다
      platform: {actions: [judgeGate], screens: [/activation/decide, /admin/approval], gates: [G9]}
      next: [FPW.7-A12]
    - id: FPW.7-A12
      name: Release Sign-off(출시 책임 확인)
      outcomes: [O4]
      rules: [FFG-LCY-001]
      raci: {R: [R-FO], A: R-FO, C: [R-SM], I: [R-REL, R-PO]}
      inputs: [WP-G7-DECISION, WP-SC-REVIEW, WP-CANARY-PLAN]
      outputs: [WP-RELEASE-SIGNOFF]
      steps:
        - G8·G9 판정과 Safety Case 검토·Canary 기준을 확인한다
        - Feature 상세에서 사유를 적고 개인 서명으로 출시 책임을 확인한다
        - G8·G9가 다시 판정되면 이전 서명은 효력이 없으므로 다시 서명한다
      checks:
        - 서명이 현재 G8·G9 판정 기록에 묶여 유효하다
      platform:
        actions: [signRelease]
        screens: [/features/:id/:ver]
        anchor: release-signoff
        ui: {fields: [reason], buttons: [signRelease]}
      sla_hours: 24
      next: [FPW.7-A09]
    - id: FPW.7-A09
      name: 출시 전이
      outcomes: [O4]
      rules: []
      raci: {R: [R-REL], A: R-REL, C: [R-FO], I: [R-OPS, R-PO]}
      inputs: [WP-G7-DECISION, WP-RELEASE-SIGNOFF]
      outputs: [WP-RELEASE-RECORD]
      steps:
        - OTA·Operations Gate PASS와 유효한 Release Sign-off를 확인하고 Lifecycle을 VERIFIED에서 RELEASED로 전이한다
        - 전이 결과를 운영 조직과 상품 Owner에게 알린다
        - 판정이 FAIL이면 개발 단계로 되돌리는 전이를 하고 사유를 남긴다
      checks:
        - Feature Version이 RELEASED이고 전이 수행자가 기록되었다
      platform: {actions: [transition], screens: [/features/:id/:ver]}
      next: [FPW.7-A10, FPW.7-A11]
    - id: FPW.7-A10
      name: 상품 고객 출시 승인
      outcomes: [O3]
      rules: []
      raci: {R: [R-PO], A: R-PO, C: [R-FO], I: [R-PDA, R-OPS]}
      inputs: [WP-RELEASE-RECORD, WP-PRODUCT-APPROVAL]
      outputs: [WP-PRODUCT-RELEASE]
      steps:
        - 구성 승인자가 아닌 상품 Owner가 고객 출시를 승인한다
        - 플랫폼이 구성 승인자와 같은 사람의 승인을 거부하면 다른 승인자로 다시 승인한다
        - 출시 승인 결과를 상품 기획과 운영 조직에 알린다
      checks:
        - 고객 출시 승인자가 구성 승인자와 다르다
      platform: {actions: [productTransition], screens: [/products/:id/:ver]}
    - id: FPW.7-A11
      name: Canary 활성화·단계적 확대
      outcomes: [O5]
      rules: [FFG-LCY-009, FFG-TST-010]
      raci: {R: [R-OPS], A: R-OPS, C: [R-SM, R-REL], I: [R-FO, R-QA]}
      inputs: [WP-RELEASE-RECORD, WP-CANARY-PLAN]
      outputs: [WP-ROLLOUT-RECORD]
      steps:
        - 승인 범위 안에서 Canary Cohort부터 활성화를 적용한다
        - 관측 기간 동안 중단 기준을 감시하고 만족할 때만 다음 Cohort로 넓힌다
        - 중단 기준에 걸리면 확대를 멈추고 이상 징후 대응(FPW.8)으로 넘긴다
      checks:
        - 단계마다 관측 결과와 확대·중단 결정이 기록되었다
      platform: {actions: [stageRollout], screens: [/activation/decide, /fleet/live]}
